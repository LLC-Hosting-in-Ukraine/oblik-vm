# Тести і збірка OblikVM.exe на Windows. Тег vX.Y.Z — ще й реліз (exe + SHA256SUMS.txt).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # створення релізу за тегом

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Залежності
        run: python -m pip install -r requirements.txt

      - name: Тести
        run: python -m pytest -q

      - name: Тег збігається з версією програми
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = python -c "import oblik; print(oblik.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Тег ${{ github.ref_name }} не збігається з версією $version (oblik/__init__.py)"
            exit 1
          }

      - name: Збірка exe
        run: pyinstaller oblik.spec --noconfirm --clean

      - name: SHA-256
        run: |
          $hash = (Get-FileHash dist\OblikVM.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  OblikVM.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OblikVM-${{ github.sha }}
          path: |
            dist/OblikVM.exe
            dist/SHA256SUMS.txt

      - name: Нотатки випуску з CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release_notes.py "${{ github.ref_name }}" > dist/NOTES.md

      - name: Реліз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/OblikVM.exe dist/SHA256SUMS.txt
          --title "Облік ВМ ${{ github.ref_name }}"
          --notes-file dist/NOTES.md
